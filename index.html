<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoneme Lip Sync Face</title>
    <style>
        body {
            margin: 0;
            background-color: #2b2b2b;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            cursor: pointer; /* Indicates screen is clickable */
        }
        canvas {
            background: transparent;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="faceCanvas" width="800" height="800"></canvas>

    <script>
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');

        // Map mouth images to sound types/phonemes:
        const mouthFiles = {
            closed: 'mouth_closed.png', // Silence / M, B, P
            wide_A: 'mouth_A_E.png',    // Wide open vowels (A, E)
            round_O: 'mouth_O_U.png',   // Rounded lips vowels (O, U)
            teeth_S: 'mouth_S_F.png'    // Teeth together / Friction sounds (S, F, T, Z)
        };

        const mouthImages = {};
        let imagesLoaded = 0;
        const totalImages = Object.keys(mouthFiles).length;

        // Preload all phoneme images
        for (let key in mouthFiles) {
            const img = new Image();
            img.src = mouthFiles[key];
            img.onload = () => {
                imagesLoaded++;
                if (imagesLoaded === totalImages) {
                    drawFace('closed');
                }
            };
            mouthImages[key] = img;
        }

        let audioContext, analyser, microphone, dataArray;
        let isStarted = false;

        function drawFace(shapeKey) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const activeImage = mouthImages[shapeKey] || mouthImages['closed'];
            if (activeImage) {
                ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
            }
        }

        // Tap anywhere on the screen to initialize microphone
        async function startListening() {
            if (isStarted) return; // Prevent restarting multiple times
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                isStarted = true;
                updateLoop();
            } catch (err) {
                alert('Microphone access denied or not supported on this device.');
                console.error(err);
            }
        }

        // Listen for screen tap/click
        window.addEventListener('click', startListening);
        window.addEventListener('touchstart', startListening);

        function updateLoop() {
            requestAnimationFrame(updateLoop);

            analyser.getByteFrequencyData(dataArray);

            // Separate frequency spectrum into 3 sound bands
            let bass = 0, mid = 0, treble = 0;
            const binCount = dataArray.length;

            for (let i = 0; i < binCount; i++) {
                if (i < binCount * 0.15) {
                    bass += dataArray[i]; // Low pitch (O / U sounds)
                } else if (i < binCount * 0.5) {
                    mid += dataArray[i];  // Mid pitch (A / E sounds)
                } else {
                    treble += dataArray[i]; // High pitch (S / F / T / Z sounds)
                }
            }

            // Calculate averages
            bass = bass / (binCount * 0.15);
            mid = mid / (binCount * 0.35);
            treble = treble / (binCount * 0.5);

            let totalVolume = (bass + mid + treble) / 3;

            // Pick mouth shape based on dominant frequency
            let currentMouth = 'closed';

            if (totalVolume > 15) { // Silence threshold
                if (treble > mid && treble > bass && treble > 30) {
                    currentMouth = 'teeth_S'; // S, T, F, Z sounds
                } else if (bass > mid * 1.2) {
                    currentMouth = 'round_O'; // O, U sounds
                } else {
                    currentMouth = 'wide_A';  // A, E sounds
                }
            }

            drawFace(currentMouth);
        }
    </script>
</body>
</html>
