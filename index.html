<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animated Character</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <canvas id="faceCanvas"></canvas>

    <script>
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawFace(currentShape);
        }
        window.addEventListener('resize', resizeCanvas);

        // Required repository files:
        const mouthFiles = {
            closed: 'mouth_closed.png',
            wide_A: 'mouth_A_E.png',
            blink: 'face_blink.png'
        };

        const mouthImages = {};
        let currentShape = 'closed';

        // Preload images safely without crashing if a file path is wrong
        for (let key in mouthFiles) {
            const img = new Image();
            img.src = mouthFiles[key];
            img.onload = () => { drawFace(currentShape); };
            img.onerror = () => { console.warn("Could not load image: " + mouthFiles[key]); };
            mouthImages[key] = img;
        }

        resizeCanvas();

        function drawFace(shapeKey) {
            currentShape = shapeKey;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fallback: If requested image isn't ready, try 'closed', or skip drawing frame
            let activeImage = mouthImages[shapeKey];
            if (!activeImage || !activeImage.
