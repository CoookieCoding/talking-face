<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lip Sync Face</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Changed from cover to contain so the whole image shows */
        }
    </style>
</head>
<body>

    <canvas id="faceCanvas" width="1024" height="1024"></canvas>

    <script>
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');

        // Map mouth images to 3 phoneme types (O removed):
        const mouthFiles = {
            closed: 'mouth_closed.png', // Silence / M, B, P
            wide_A: 'mouth_A_E.png',    // Wide open vowels (A, E)
            teeth_S: 'mouth_S_F.png'    // Teeth together / Friction sounds (S, F, T, Z)
        };

        const mouthImages = {};
        let imagesLoaded = 0;
        const totalImages = Object.keys(mouthFiles).length;

        // Preload phoneme images
        for (let key in mouthFiles) {
            const img = new Image();
            img.src = mouthFiles[key];
            img.onload = () => {
                imagesLoaded++;
                if (imagesLoaded === totalImages) {
                    drawFace('closed');
                }
            };
            mouthImages[key] = img;
        }

        let audioContext, analyser, microphone, dataArray;
        let isStarted = false;

        function drawFace(shapeKey) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const activeImage = mouthImages[shapeKey] || mouthImages['closed'];
            if (activeImage) {
                ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);
            }
        }

        // Tap anywhere on the screen to initialize microphone
        async function startListening() {
            if (isStarted) return;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                isStarted = true;
                updateLoop();
            } catch (err) {
                alert('Microphone access denied or not supported on this device.');
                console.error(err);
            }
        }

        // Listen for screen tap/click
        window.addEventListener('click', startListening);
        window.addEventListener('touchstart', startListening);

        function updateLoop() {
            requestAnimationFrame(updateLoop);

            analyser.getByteFrequencyData(dataArray);

            let bass = 0, mid = 0, treble = 0;
            const binCount = dataArray.length;

            for (let i = 0; i < binCount; i++) {
                if (i < binCount * 0.15) {
                    bass += dataArray[i]; 
                } else if (i < binCount * 0.5) {
                    mid += dataArray[i];  
                } else {
                    treble += dataArray[i]; 
                }
            }

            bass = bass / (binCount * 0.15);
            mid = mid / (binCount * 0.35);
            treble = treble / (binCount * 0.5);

            let totalVolume = (bass + mid + treble) / 3;

            // Pick mouth shape based on dominant frequency (O-shape check removed)
            let currentMouth = 'closed';

            if (totalVolume > 4) { 
                if (treble > mid && treble > bass) {
                    currentMouth = 'teeth_S'; // S, T, F, Z sounds
                } else {
                    currentMouth = 'wide_A';  // A, E, and general open sounds
                }
            }

            drawFace(currentMouth);
        }
    </script>
</body>
</html>
